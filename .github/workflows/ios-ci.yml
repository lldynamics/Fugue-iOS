name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: Build & Unit Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode & inspect toolchain
        run: |
          BEST_XCODE=$(python3 - <<'PY'
          import plistlib, re
          from pathlib import Path

          candidates = []
          for app in Path("/Applications").glob("Xcode*.app"):
              info_plist = app / "Contents" / "Info.plist"
              dev_dir = app / "Contents" / "Developer"
              if not info_plist.is_file() or not dev_dir.is_dir():
                  continue
              try:
                  info = plistlib.loads(info_plist.read_bytes())
              except Exception:
                  continue
              ver_str = str(info.get("CFBundleShortVersionString", "0"))
              nums = tuple(int(x) for x in re.findall(r"\d+", ver_str)) or (0,)
              is_prerelease = any(tag in app.name.lower() for tag in ("beta", "rc"))
              candidates.append(((0 if is_prerelease else 1), nums, str(dev_dir)))

          if candidates:
              candidates.sort(reverse=True)
              print(candidates[0][2])
          PY
          )
          if [ -n "$BEST_XCODE" ] && [ -d "$BEST_XCODE" ]; then
            echo "Selecting Xcode developer dir: $BEST_XCODE"
            sudo xcode-select -s "$BEST_XCODE" || echo "Keeping default Xcode developer dir"
          fi
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Verify String Catalogs & InfoPlist compliance
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          loc_path = Path("iOSBox/Localizable.xcstrings")
          info_path = Path("iOSBox/InfoPlist.xcstrings")
          shortcuts_path = Path("iOSBox/AppShortcuts.xcstrings")

          loc = json.loads(loc_path.read_text(encoding="utf-8"))
          info = json.loads(info_path.read_text(encoding="utf-8"))
          shortcuts = json.loads(shortcuts_path.read_text(encoding="utf-8"))

          missing = []
          for key, entry in loc["strings"].items():
              locs = entry.get("localizations", {})
              for lang in ("en", "zh-Hans"):
                  lang_entry = locs.get(lang, {})
                  val = lang_entry.get("stringUnit", {}).get("value", "")
                  plural = lang_entry.get("variations", {}).get("plural", {})
                  if not val and not plural:
                      missing.append((key, lang))
          assert not missing, f"Empty localizations in Localizable.xcstrings: {missing[:10]}"

          import re
          cjk = re.compile(r"[\u4e00-\u9fff]")
          assert len(shortcuts["strings"]) >= 7, "AppShortcuts.xcstrings must cover all AppShortcut phrases"
          for key, entry in shortcuts["strings"].items():
              locs = entry.get("localizations", {})
              for lang in ("en", "zh-Hans"):
                  vals = locs.get(lang, {}).get("stringSet", {}).get("values", [])
                  assert vals, f"Missing {lang} stringSet values for {key!r}"
                  for phrase in vals:
                      assert "${applicationName}" in phrase, f"Missing ${{applicationName}} in {phrase!r}"
                      if lang == "en":
                          assert not cjk.search(phrase), f"Chinese characters in English Siri phrase: {phrase!r}"

          forbidden_keys = {
              "NSCalendarsWriteOnlyAccessUsageDescription",
              "NSRemindersFullAccessUsageDescription",
          }
          present_forbidden = forbidden_keys.intersection(info["strings"].keys())
          assert not present_forbidden, f"Deprecated InfoPlist keys still present: {present_forbidden}"

          print(f"String catalogs OK: {len(loc['strings'])} Localizable, {len(info['strings'])} InfoPlist, {len(shortcuts['strings'])} AppShortcuts.")
          PY

      - name: Pick available iPhone Simulator
        id: sim
        run: |
          SIM_INFO=$(python3 - <<'PY'
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))
          candidates = []

          def parse_runtime_version(runtime_id: str) -> tuple[int, ...]:
              m = re.search(r"iOS[- ](\d+)(?:[-.](\d+))?(?:[-.](\d+))?", runtime_id)
              if not m:
                  return (0, 0, 0)
              return (int(m.group(1)), int(m.group(2) or 0), int(m.group(3) or 0))

          def score_device_name(name: str) -> tuple[int, int, int]:
              upper = name.upper()
              is_not_se = 0 if "IPHONE SE" in upper or re.search(r"\bSE\b", upper) else 1
              gen_match = re.search(r"iPhone\s+(\d+)", name, re.IGNORECASE)
              generation = int(gen_match.group(1)) if gen_match else (16 if "AIR" in upper else 0)
              if "PRO" in upper and "MAX" not in upper:
                  tier = 4
              elif "PRO MAX" in upper:
                  tier = 3
              elif not any(tok in upper for tok in ("PLUS", "MINI", "SE", "AIR")) and not re.search(r"iPhone\s+\d+e\b", name, re.IGNORECASE):
                  tier = 2
              else:
                  tier = 1
              return (is_not_se, generation, tier)

          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              rt_ver = parse_runtime_version(runtime)
              meets_deployment = 1 if rt_ver[0] >= 18 else 0
              for dev in devices:
                  name = dev.get("name", "")
                  if dev.get("isAvailable") and "iPhone" in name:
                      is_not_se, gen, tier = score_device_name(name)
                      candidates.append((
                          (meets_deployment, is_not_se, rt_ver, gen, tier, name),
                          dev["udid"],
                          f"{name} ({runtime})"
                      ))

          if not candidates:
              sys.exit("No available iPhone simulator found")
          candidates.sort(key=lambda item: item[0], reverse=True)
          print(f"{candidates[0][1]}\t{candidates[0][2]}")
          PY
          )
          SIM_ID=$(printf '%s' "$SIM_INFO" | cut -f1)
          SIM_LABEL=$(printf '%s' "$SIM_INFO" | cut -f2-)
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIM_LABEL [$SIM_ID]"
          xcrun simctl boot "$SIM_ID" || true

      - name: Build for testing (all targets)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project iOSBox.xcodeproj \
            -scheme iOSBox \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}"

      - name: Run iOSBoxTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project iOSBox.xcodeproj \
            -scheme iOSBox \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -parallel-testing-enabled NO \
            -only-testing:iOSBoxTests
